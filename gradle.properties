# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.0.263
group=com.huziyang520.merlintools
java_version=25

# Common
minecraft_version=26.3
minecraft_version_slug=26.3
mod_name=MerlinTools
mod_author=Huziyang520
mod_id=merlintools
license=CC0-1.0
credits=
# Single line only: this value is expanded into both fabric.mod.json (a JSON string) and
# neoforge.mods.toml. A real newline here produces invalid JSON/TOML, so keep it on one line.
description=A testing toolkit for Minecraft: editable test weapons, an item editor, a health editor, command macros and HUD readouts, all switchable. | Feedback: https://github.com/Huziyang520/MerlinTools/issues | Backup feedback: https://issue.mengcai.online/
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.6+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# 26.3 dropped modLoader / loaderVersion from neoforge.mods.toml, so there is no loader version range property anymore.
neoforge_version=26.3.0.1-beta

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
