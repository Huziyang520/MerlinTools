# Important Notes:
# Every field used by META-INF/mods.toml / pack.mcmeta must also be listed in build.gradle's
# replaceProperties map, otherwise the placeholder is left unexpanded in the shipped jar.
#
# Minecraft 1.20.1 / Forge.

# Project
version=1.0.1.1201
group=com.huziyang520.merlintools
java_version=17

# Common
minecraft_version=1.20.1
mod_name=MerlinTools
mod_author=Huziyang520
mod_id=merlintools
license=CC0-1.0
credits=
# Single line only. This value is expanded into mods.toml as a TOML basic string; a real newline
# produces "Invalid newline in basic string" and the whole jar is rejected as "not a valid mod file".
description=A testing toolkit for Minecraft: editable test weapons, an item editor, a health editor, command macros and HUD readouts, all switchable. \\nFeedback: https://github.com/Huziyang520/MerlinTools/issues | Backup feedback: https://issue.mengcai.online/
minecraft_version_range=[1.20.1, 1.21)

# Forge, see https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml
forge_version=47.4.26
forge_loader_version_range=[47,)

# Gradle
# en locale + UTF-8 keep javac diagnostics readable in this shell.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
