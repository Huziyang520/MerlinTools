# MerlinTools - 26.1 ~ 26.2 compile target (MultiLoader).
#
# The whole target compiles against 26.1.2, the lower bound of the range, so one jar of each loader
# runs on every version in between.

# Project
version=1.0.2612
group=com.huziyang520.merlintools
java_version=25

# Common
minecraft_version=26.1.2
minecraft_version_slug=26.1-26.2
mod_name=MerlinTools
mod_author=Huziyang520
mod_id=merlintools
license=CC0-1.0
credits=
# Single line only, expanded into fabric.mod.json and neoforge.mods.toml alike.
description=A testing toolkit for Minecraft: editable test weapons, an item editor, a health editor, command macros and HUD readouts, all switchable. | Feedback: https://github.com/Huziyang520/MerlinTools/issues | Backup feedback: https://issue.mengcai.online/
minecraft_version_range=[26.1,26.3)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.94
# 26.1-26.2 still declare modLoader / loaderVersion in neoforge.mods.toml, so the loader range
# property is required here (26.3 dropped it).
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
