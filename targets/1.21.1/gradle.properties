# MerlinTools - 1.21.1 compile target (NeoForge only).
#
# Structure: a single module. Java and resources are synced from ../../common (the 26.X main tree)
# into build/shared and merged with overlay/, so every forced version difference lives in overlay.

# Project
version=1.0.1221
group=com.huziyang520.merlintools
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
mod_name=MerlinTools
mod_author=Huziyang520
mod_id=merlintools
license=CC0-1.0
credits=
# Must stay on one line: expanded into the TOML basic string of neoforge.mods.toml.
# The key is mod_description rather than description because Gradle uses Project#description itself.
mod_description=A testing toolkit for Minecraft: editable test weapons, an item editor, a health editor, command macros and HUD readouts, all switchable. | Feedback: https://github.com/Huziyang520/MerlinTools/issues | Backup feedback: https://issue.mengcai.online/

# NeoForge
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
