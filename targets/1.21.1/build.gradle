// MerlinTools - the 1.21.1 compile target (NeoForge only).
//
// Sources come from ../../common (the 26.X common tree) plus overlay/; every forced version
// difference lives in overlay, never in an if here.
//
// ModDevGradle 2.0.147 + Gradle 9.7.1 + JDK 21. NeoForge 1.21.1 runs on Mojang names, so there is
// no refmap and no Mixin annotation processor.

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

base {
    archivesName = "${mod_id}-${version}-neoforge-${minecraft_version}"
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveVersion.set('')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'AliyunPublic'; url = uri('https://maven.aliyun.com/repository/public') }
    maven { name = 'TencentPublic'; url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }
    maven { name = 'NeoForged'; url = uri('https://maven.neoforged.net/releases') }
}

// Files under overlay/java replace the common one with the same path.
def overlaidJava = [
        'com/huziyang520/merlintools/MerlinToolsNeoForge.java',
        'com/huziyang520/merlintools/client/MerlinToolsNeoForgeClient.java',
        'com/huziyang520/merlintools/client/HudRowPolicy.java',
        'com/huziyang520/merlintools/client/TestTridentRenderer.java',
        'com/huziyang520/merlintools/config/NeoConfigs.java',
        'com/huziyang520/merlintools/config/NeoSpecBackend.java',
        'com/huziyang520/merlintools/impl/PermissionGate.java',
        'com/huziyang520/merlintools/mixin/MixinHud.java',
        'com/huziyang520/merlintools/mixin/RangedAttributeAccessor.java',
        'com/huziyang520/merlintools/mixin/MixinMinecraftUseItem.java',
        'com/huziyang520/merlintools/network/DamageFeedbackPayload.java',
        'com/huziyang520/merlintools/network/HealthEditPayload.java',
        'com/huziyang520/merlintools/network/ItemEditPayload.java',
        'com/huziyang520/merlintools/platform/NeoForgeRegistrationBridge.java',
        'com/huziyang520/merlintools/platform/services/IRegistrationBridge.java',
        'com/huziyang520/merlintools/tools/HealthCeiling.java',
        'com/huziyang520/merlintools/tools/HealthEditorItem.java',
        'com/huziyang520/merlintools/tools/TestTridentItem.java',
        'com/huziyang520/merlintools/tools/TestWeapons.java',
        'com/huziyang520/merlintools/tools/ToolCreativeEntries.java',
        'com/huziyang520/merlintools/tools/hotkey/HotkeyRegistry.java',
        'com/huziyang520/merlintools/tools/hud/CombatFeedback.java',
        'com/huziyang520/merlintools/tools/ui/ConfigScreens.java',
        'com/huziyang520/merlintools/tools/ui/DeleteEnchantsConfirmScreen.java',
        'com/huziyang520/merlintools/tools/ui/EnchantSelectionScreen.java',
        'com/huziyang520/merlintools/tools/ui/EnchantmentLevel.java',
        'com/huziyang520/merlintools/tools/ui/HealthEditorScreen.java',
        'com/huziyang520/merlintools/tools/ui/ItemEditorScreen.java',
        'com/huziyang520/merlintools/tools/ui/MacroScreen.java',
        'com/huziyang520/merlintools/tools/ui/MerlinScreens.java',
        'com/huziyang520/merlintools/tools/ui/MerlinUi.java',
        'com/huziyang520/merlintools/tools/ui/vanilla/PanelLayout.java',
        'com/huziyang520/merlintools/tools/ui/vanilla/ScrollArea.java',
        'com/huziyang520/merlintools/tools/ui/vanilla/VanillaScreen.java',
        'com/huziyang520/merlintools/tools/ui/vanilla/VanillaUi.java',
]

def sharedJava = layout.buildDirectory.dir('shared/java')
def sharedResources = layout.buildDirectory.dir('shared/resources')

tasks.register('sharedJava', Sync) {
    from('../../common/src/main/java') {
        overlaidJava.each { exclude it }
    }
    from('overlay/java')
    into sharedJava
}

tasks.register('sharedResources', Sync) {
    // overlay wins on a name clash: it is written first, EXCLUDE skips the duplicate from common.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('overlay/resources')
    from('../../common/src/main/resources') {
        exclude 'merlintools.mixins.json'
        // 1.21.1 does not read assets/<ns>/items/; item model definitions arrived in 1.21.4.
        exclude 'assets/merlintools/items/**'
    }
    into sharedResources
}

tasks.named('compileJava') { dependsOn 'sharedJava' }
tasks.named('processResources') { dependsOn 'sharedResources' }

sourceSets {
    main {
        java {
            setSrcDirs([])
            srcDir sharedJava
        }
        resources {
            setSrcDirs([])
            srcDir sharedResources
            // Resources only this target ships: neoforge.mods.toml, the neoforge mixin config,
            // pack.mcmeta and the icon.
            srcDir 'src/main/resources'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: license, mod_version: version,
            mod_authors            : mod_author, mod_description: mod_description,
            mod_credits            : credits,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_author,
                'Built-On-Minecraft'      : minecraft_version,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}
