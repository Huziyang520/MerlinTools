# Forge 1.20.1 mod metadata.
#
# Dependencies say `mandatory`, and the mixin configuration is announced in the jar manifest rather
# than here, because Forge 1.20.1's ModFileParser knows no `[[mixins]]` key.
modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
credits="${credits}"
description="${description}"
displayURL="https://github.com/Huziyang520/MerlinTools"
issueTrackerURL="https://github.com/Huziyang520/MerlinTools/issues"
logoFile="MT.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
